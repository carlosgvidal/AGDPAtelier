<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Private Atelier — A GROSS DOMESTIC PRODUCT.</title><script type="importmap">{"imports":{"manifold-3d":"https://unpkg.com/manifold-3d@3.5.1/manifold.js","three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script><link rel="stylesheet" href="agdp-site.css"><link rel="stylesheet" href="private.css"></head><body><main class="private"><header><div class="eyebrow">A GROSS DOMESTIC PRODUCT. / PRIVATE ATELIER</div><h1>High Jewelry Studies.</h1><p>Existing Atelier geometry. Additional material and gemstone systems. One seeded occurrence.</p></header><section class="work"><aside class="controls"><label>TYPOLOGY<select id="type"><option value="ring">Ring</option><option value="pendant">Pendant</option><option value="bangle">Bangle</option><option value="cuffBracelet">Cuff bracelet</option><option value="earCuff">Ear cuff</option><option value="brooch">Brooch</option><option value="cufflinks">Cufflinks</option><option value="hoopEarring">Hoop earrings</option></select></label><label>SCALE / MM<input id="size" type="number" value="18" step="0.5"></label><label>METAL<select id="metal"><option value="auto">Auto / seeded</option><option value="silver">Sterling silver .925</option><option value="platinum">Platinum</option><option value="yellowGold">Yellow gold</option><option value="roseGold">Rose gold</option><option value="whiteGold">White gold</option></select></label><label>STONE<select id="stone"><option value="auto">Auto / seeded</option></select></label><label>FORMAT<select id="format"><option value="auto">Auto / seeded</option><option value="faceted">Traditional faceted</option><option value="cabochon">Cabochon</option><option value="slab">Slab / laja</option><option value="pave">Pavé</option><option value="pearl">Pearl</option></select></label><label>CUT<select id="cut"><option value="auto">Auto / seeded</option></select></label><label>SEED<input id="seed" type="text"></label><button id="generate">GENERATE NEW OCCURRENCE</button><button id="replay">REPLAY SEED</button><div id="status">INITIALIZING…</div><div id="meta"></div></aside><div class="viewport"><canvas id="view"></canvas></div></section></main><script src="configurator.runtime.js"></script><script>const stones=['diamond','ruby','sapphire','emerald','aquamarine','tourmaline','amethyst','citrine','garnet','peridot','topaz','spinel','tanzanite','labradorite','moonstone','rockCrystal','obsidian','jadeite','opal','onyx','turquoise','lapis','coral','pearl'];for(const s of stones)stone.add(new Option(s.replace(/([A-Z])/g,' $1'),s));for(const c of ['round','oval','emerald','asscher','princess','cushion','pear','marquise','trillion','rose'])cut.add(new Option(c,c));</script><script type="module" src="configurator.geometry.js"></script><script type="module" src="configurator.viewport.js"></script><script type="module" src="private-ateliers.js"></script></body></html>
